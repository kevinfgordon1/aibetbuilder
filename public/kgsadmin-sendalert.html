<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>KGS Admin — Send Alert</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

<div class="max-w-2xl mx-auto px-4 py-8">

  <!-- ============ SECRET GATE ============ -->
  <div id="gate" class="bg-slate-800 rounded-lg p-6 border border-slate-700">
    <h1 class="text-xl font-bold mb-4">🔒 Admin access</h1>
    <p class="text-slate-400 text-sm mb-4">Enter your admin secret to continue.</p>
    <input
      id="secret-input"
      type="password"
      placeholder="ADMIN_API_SECRET"
      class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 mb-3"
      autocomplete="off"
    />
    <label class="flex items-center text-sm text-slate-400 mb-4">
      <input id="remember" type="checkbox" class="mr-2" checked />
      Remember on this browser
    </label>
    <button
      id="unlock-btn"
      class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded"
    >Unlock</button>
    <p id="gate-error" class="text-red-400 text-sm mt-3 hidden"></p>
  </div>

  <!-- ============ ADMIN FORM ============ -->
  <div id="admin" class="hidden">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold">Send Bet Alert</h1>
      <button id="logout-btn" class="text-sm text-slate-400 hover:text-slate-100">Log out</button>
    </div>

    <div class="bg-slate-800 rounded-lg p-6 border border-slate-700 space-y-4">

      <!-- Customer dropdown -->
      <div>
        <label class="block text-sm font-medium mb-1">Customer</label>
        <select
          id="customer"
          class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100"
        >
          <option value="">Loading…</option>
        </select>
      </div>

      <!-- Wager -->
      <div>
        <label class="block text-sm font-medium mb-1">Wager</label>
        <input
          id="wager"
          type="text"
          placeholder="e.g. Yankees ML -120"
          class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100"
        />
      </div>

      <!-- Risk + Profit side by side -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium mb-1">Risk ($)</label>
          <input
            id="risk"
            type="number"
            step="0.01"
            placeholder="100"
            class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100"
          />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">To Win ($)</label>
          <input
            id="profit"
            type="number"
            step="0.01"
            placeholder="83.33"
            class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100"
          />
        </div>
      </div>

      <!-- Placed at -->
      <div>
        <label class="block text-sm font-medium mb-1">Placed at <span class="text-slate-500">(ET)</span></label>
        <div class="flex items-center gap-2">
          <input
            id="placed-at"
            type="datetime-local"
            class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100"
          />
          <button id="now-btn" type="button" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded text-sm">
            Now
          </button>
        </div>
      </div>

      <!-- Optional note -->
      <div>
        <label class="block text-sm font-medium mb-1">
          Note <span class="text-slate-500">(optional)</span>
        </label>
        <textarea
          id="notes"
          rows="2"
          placeholder="Lock of the day…"
          class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100"
        ></textarea>
      </div>

    </div>

    <!-- Preview -->
    <div class="mt-4">
      <p class="text-sm text-slate-400 mb-2">Preview:</p>
      <pre id="preview" class="bg-slate-800 border border-slate-700 rounded-lg p-4 whitespace-pre-wrap text-sm font-mono text-slate-100 min-h-[120px]"></pre>
    </div>

    <!-- Send button -->
    <button
      id="send-btn"
      class="mt-4 w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:cursor-not-allowed text-white font-semibold py-3 rounded text-lg"
    >Send to Telegram</button>

    <!-- Result -->
    <div id="result" class="mt-4 hidden rounded-lg p-3 text-sm"></div>
  </div>

</div>

<script>
  // ── Supabase config (anon key is safe in client-side code) ───────────────
  const SUPABASE_URL  = 'https://xuolkiadmumtbksbyjzc.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1b2xraWFkbXVtdGJrc2J5anpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTY2NTgsImV4cCI6MjA5MTc3MjY1OH0.txqS93dI68Fmp1AbY06lfzokWgJVFGcxaTTXIZTrqj8';

  // ── DOM refs ────────────────────────────────────────────────────────────
  const gate         = document.getElementById('gate');
  const admin        = document.getElementById('admin');
  const secretInput  = document.getElementById('secret-input');
  const rememberBox  = document.getElementById('remember');
  const unlockBtn    = document.getElementById('unlock-btn');
  const gateError    = document.getElementById('gate-error');
  const logoutBtn    = document.getElementById('logout-btn');
  const customerSel  = document.getElementById('customer');
  const wagerIn      = document.getElementById('wager');
  const riskIn       = document.getElementById('risk');
  const profitIn     = document.getElementById('profit');
  const placedIn     = document.getElementById('placed-at');
  const nowBtn       = document.getElementById('now-btn');
  const notesIn      = document.getElementById('notes');
  const preview      = document.getElementById('preview');
  const sendBtn      = document.getElementById('send-btn');
  const resultDiv    = document.getElementById('result');

  let ADMIN_SECRET   = null;
  let customers      = [];

  // ── Auth gate ───────────────────────────────────────────────────────────
  function tryUnlock(secret, remember) {
    if (!secret) {
      showGateError('Enter your admin secret.');
      return;
    }
    ADMIN_SECRET = secret;
    if (remember) localStorage.setItem('kgs_admin_secret', secret);
    gate.classList.add('hidden');
    admin.classList.remove('hidden');
    initialise();
  }

  function showGateError(msg) {
    gateError.textContent = msg;
    gateError.classList.remove('hidden');
  }

  unlockBtn.addEventListener('click', () => tryUnlock(secretInput.value.trim(), rememberBox.checked));
  secretInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlockBtn.click(); });

  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('kgs_admin_secret');
    ADMIN_SECRET = null;
    admin.classList.add('hidden');
    gate.classList.remove('hidden');
    secretInput.value = '';
  });

  // Restore from localStorage if present
  const remembered = localStorage.getItem('kgs_admin_secret');
  if (remembered) tryUnlock(remembered, true);

  // ── Init: load customers + set default time + wire preview ─────────────
  async function initialise() {
    setNow();
    await loadCustomers();
    refreshPreview();
    [customerSel, wagerIn, riskIn, profitIn, placedIn, notesIn].forEach(el =>
      el.addEventListener('input', refreshPreview)
    );
  }

  // ── Load active customers from Supabase ────────────────────────────────
  async function loadCustomers() {
    try {
      const resp = await fetch(
        `${SUPABASE_URL}/rest/v1/telegram_users?select=id,customer_name&is_active=eq.true&order=customer_name.asc`,
        {
          headers: {
            apikey: SUPABASE_ANON,
            Authorization: `Bearer ${SUPABASE_ANON}`,
          },
        }
      );
      if (!resp.ok) throw new Error(`Supabase ${resp.status}`);
      customers = await resp.json();
      customerSel.innerHTML =
        '<option value="">Select a customer…</option>' +
        customers.map(c => `<option value="${c.id}">${escapeHtml(c.customer_name)}</option>`).join('');
    } catch (err) {
      customerSel.innerHTML = '<option value="">Error loading customers</option>';
      console.error(err);
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  // ── "Now" button: set placed-at to current time (local browser) ────────
  function setNow() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    placedIn.value =
      `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}` +
      `T${pad(now.getHours())}:${pad(now.getMinutes())}`;
    refreshPreview();
  }
  nowBtn.addEventListener('click', setNow);

  // ── Preview rendering (mirrors the API's message formatter) ────────────
  function refreshPreview() {
    const customerName =
      customerSel.options[customerSel.selectedIndex]?.text || '[customer]';
    const wager  = wagerIn.value.trim() || '[wager]';
    const risk   = parseFloat(riskIn.value);
    const profit = parseFloat(profitIn.value);
    const notes  = notesIn.value.trim();

    const placedDate = placedIn.value ? new Date(placedIn.value) : new Date();
    const placedFormatted = placedDate.toLocaleString('en-US', {
      timeZone: 'America/New_York',
      month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true,
    });

    let text =
      `✅ Bet Placed for ${customerName}\n\n` +
      `Wager: ${wager}\n` +
      `Risk: $${isFinite(risk) ? risk.toFixed(2) : '0.00'}\n` +
      `To Win: $${isFinite(profit) ? profit.toFixed(2) : '0.00'}\n` +
      `Placed: ${placedFormatted} ET`;

    if (notes) text += `\n\n📝 Note: ${notes}`;

    preview.textContent = text;
  }

  // ── Send to API ────────────────────────────────────────────────────────
  sendBtn.addEventListener('click', async () => {
    const telegram_user_id = customerSel.value;
    const bet_description  = wagerIn.value.trim();
    const risk             = parseFloat(riskIn.value);
    const profit           = parseFloat(profitIn.value);
    const placed_at_local  = placedIn.value;
    const notes            = notesIn.value.trim();

    if (!telegram_user_id) return showResult('Pick a customer.', 'error');
    if (!bet_description)  return showResult('Enter a wager.', 'error');
    if (!isFinite(risk))   return showResult('Enter a risk amount.', 'error');
    if (!isFinite(profit)) return showResult('Enter a profit amount.', 'error');
    if (!placed_at_local)  return showResult('Pick a placed-at time.', 'error');

    const placed_at = new Date(placed_at_local).toISOString();

    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending…';
    hideResult();

    try {
      const resp = await fetch('/api/send-telegram-alert', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-admin-secret': ADMIN_SECRET,
        },
        body: JSON.stringify({
          telegram_user_id,
          bet_description,
          risk,
          profit,
          placed_at,
          notes,
        }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        showResult(`Failed: ${data.error || resp.status}`, 'error');
      } else {
        showResult(`✅ Sent to ${data.sent_to} (msg #${data.telegram_message_id})`, 'success');
        wagerIn.value = '';
        riskIn.value = '';
        profitIn.value = '';
        notesIn.value = '';
        setNow();
      }
    } catch (err) {
      showResult(`Network error: ${err.message}`, 'error');
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send to Telegram';
    }
  });

  function showResult(msg, kind) {
    resultDiv.textContent = msg;
    resultDiv.className =
      'mt-4 rounded-lg p-3 text-sm ' +
      (kind === 'success'
        ? 'bg-emerald-900/40 border border-emerald-700 text-emerald-200'
        : 'bg-red-900/40 border border-red-700 text-red-200');
    resultDiv.classList.remove('hidden');
  }

  function hideResult() {
    resultDiv.classList.add('hidden');
  }
</script>

</body>
</html>
